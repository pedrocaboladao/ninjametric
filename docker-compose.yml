services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-painel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-painel_vendas}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-painel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-painel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-painel_vendas}
      ML_CLIENT_ID: ${ML_CLIENT_ID}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET}
      ML_REDIRECT_URI: ${ML_REDIRECT_URI}
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WHATSAPP_OWNER_NUMBER: ${WHATSAPP_OWNER_NUMBER}
      NODE_ENV: production
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - whatsapp_auth:/app/whatsapp_auth

  # market-db / market-intelligence (Inteligência de Mercado) — pausados a
  # pedido do dono em 2026-08-19. Código intacto em market-intelligence/ e
  # nas rotas backend/src/routes/{marketIntelligence,internal}.ts, só não
  # sobem mais em deploy nenhum até serem religados aqui. Dado histórico
  # continua salvo no volume market_db_data no VPS (não foi apagado).

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

volumes:
  db_data:
  whatsapp_auth:
  # market_db_data intencionalmente fora daqui — o volume continua existindo
  # no VPS com o histórico salvo, só não é mais referenciado por nenhum
  # serviço enquanto o módulo estiver pausado.

name: Checagem antes do merge

on:
  pull_request:
    branches: [master]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend - checar tipos
        working-directory: backend
        run: |
          npm ci
          npx tsc --noEmit

      - name: Frontend - build
        working-directory: frontend
        run: |
          npm ci
          npm run build

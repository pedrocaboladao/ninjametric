name: Deploy para o VPS

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Decodificar chave SSH
        run: |
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Conectar no VPS e atualizar
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: /tmp/deploy_key
          command_timeout: 15m
          script: |
            set -e
            cd ~/ninjametric
            git pull
            docker compose up -d --build
            docker compose exec -T backend node dist/db/migrate.js
            docker compose exec -T backend node dist/db/seed.js

            # O Growth Hacker (Opus + raciocinio "xhigh" + dados de 16 lojas) pode
            # passar dos 60s padrao do Nginx, causando 502 antes do backend
            # terminar de responder. Ajusta uma vez so (idempotente via grep) e
            # sempre testa antes de recarregar -- se "nginx -t" falhar, reverte
            # pro backup e o site continua no ar com a config anterior.
            NGINX_CONF="/etc/nginx/sites-available/painel"
            if [ -f "$NGINX_CONF" ] && ! grep -q "proxy_read_timeout" "$NGINX_CONF"; then
              cp "$NGINX_CONF" "$NGINX_CONF.bak-timeout-fix"
              sed -i '/proxy_pass http:\/\/127\.0\.0\.1:4000;/a\    proxy_read_timeout 300s;\n    proxy_send_timeout 300s;' "$NGINX_CONF"
              if nginx -t; then
                systemctl reload nginx
                echo "Nginx: proxy_read_timeout ajustado para 300s em /api/ e /auth/."
              else
                echo "AVISO: nginx -t falhou apos ajustar o timeout -- revertendo pra config anterior."
                cp "$NGINX_CONF.bak-timeout-fix" "$NGINX_CONF"
              fi
            fi

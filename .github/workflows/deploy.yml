name: Deploy para o VPS

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# Evita dois deploys rodando ao mesmo tempo no VPS (ex: dois pushes seguidos
# rápido) — o segundo espera o primeiro terminar em vez de cancelar (um
# deploy cancelado no meio pode deixar o VPS com o build pela metade).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Decodificar chave SSH
        run: |
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Conectar no VPS e atualizar
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: /tmp/deploy_key
          command_timeout: 15m
          # As credenciais do Bling viajam como secret do GitHub e o deploy as
          # grava no .env do VPS. Sem isso alguém teria que abrir o servidor
          # por SSH e colar à mão toda vez que o secret mudar — e credencial
          # digitada em terminal é credencial que acaba num histórico de shell.
          envs: BLING_CLIENT_ID,BLING_CLIENT_SECRET,BLING_REDIRECT_URI
          script: |
            set -e
            cd ~/ninjametric
            git pull

            # Grava a chave no .env sem apagar o que já existe. Secret vazio
            # não mexe em nada: rodar o deploy sem ter cadastrado o segredo
            # ainda não pode desconfigurar o que já estava funcionando.
            gravar_env() {
              chave="$1"; valor="$2"
              [ -z "$valor" ] && return 0
              touch .env
              if grep -q "^${chave}=" .env; then
                sed -i "s|^${chave}=.*|${chave}=${valor}|" .env
              else
                echo "${chave}=${valor}" >> .env
              fi
              echo "  .env: $chave atualizado"
            }
            gravar_env BLING_CLIENT_ID "$BLING_CLIENT_ID"
            gravar_env BLING_CLIENT_SECRET "$BLING_CLIENT_SECRET"
            gravar_env BLING_REDIRECT_URI "$BLING_REDIRECT_URI"
            docker compose up -d --build
            docker compose exec -T backend node dist/db/migrate.js
            docker compose exec -T backend node dist/db/seed.js
            # market-intelligence está pausado (removido do compose em
            # 2026-08-19) — não roda migrate/seed dele enquanto isso.

            # O Growth Hacker (Opus + raciocinio "xhigh" + dados de 16 lojas) pode
            # passar de poucos minutos, e o arquivo real (sites-available/
            # ninjametrics -- NAO "painel", isso era so uma suposicao errada de
            # uma tentativa anterior) ja tinha proxy_read_timeout em 180s de
            # antes, curto demais. Substitui o valor onde quer que apareca (nao
            # so insere se estiver ausente) e sempre testa antes de recarregar --
            # se "nginx -t" falhar, reverte pro backup e o site continua no ar.
            NGINX_CONF="/etc/nginx/sites-available/ninjametrics"
            if [ -f "$NGINX_CONF" ]; then
              cp "$NGINX_CONF" "$NGINX_CONF.bak-timeout-fix"
              sed -i -E 's/proxy_(read|send)_timeout [0-9]+s;/proxy_\1_timeout 400s;/g' "$NGINX_CONF"
              if ! grep -q "proxy_send_timeout" "$NGINX_CONF"; then
                sed -i '/proxy_pass http:\/\/127\.0\.0\.1:4000;/a\    proxy_send_timeout 400s;' "$NGINX_CONF"
              fi
              if ! grep -q "proxy_read_timeout" "$NGINX_CONF"; then
                sed -i '/proxy_pass http:\/\/127\.0\.0\.1:4000;/a\    proxy_read_timeout 400s;' "$NGINX_CONF"
              fi
              if nginx -t; then
                systemctl reload nginx
                echo "Nginx: proxy_read_timeout/proxy_send_timeout ajustados para 400s."
              else
                echo "AVISO: nginx -t falhou apos ajustar o timeout -- revertendo pra config anterior."
                cp "$NGINX_CONF.bak-timeout-fix" "$NGINX_CONF"
              fi
            else
              echo "AVISO: $NGINX_CONF nao encontrado -- ajuste de timeout do Nginx pulado."
            fi
        env:
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REDIRECT_URI: ${{ secrets.BLING_REDIRECT_URI }}
